<!DOCTYPE html>
<html>
<body>
<button onclick="handleClick()">Run</button>
 
<script>
let store = [];
let turn = 1;
 
function handleClick() {
  if (turn <= 2) {
    // First two clicks: add odd numbers
    store[store.length] = turn * 2 - 1;  // 1, 3
    console.log("Inserted value:", store[store.length - 1]);
  } else if (turn <= 4) {
    // Next two clicks: add squares
    let square = turn * turn;           // 9, 16
    store[store.length] = square;
    console.log("Stored square:", square);
  } else {
    // From 5th click onwards: remove last item
    let lastIndex = store.length - 1;
    let removed = store[lastIndex];
    store.length = lastIndex;
    console.log("Deleted last:", removed);
  }
 
  turn++;
 
  console.log("---- Current contents ----");
  for (let i = 0; i < store.length; i++) {
    console.log("Index", i, "has", store[i]);
  }
}
</script>
</body>
</html>
